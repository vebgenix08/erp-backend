enum TenantType {
  INSTITUTION
  SCHOOL
  COLLEGE
  DEGREE_COLLEGE
}

enum TenantStatus {
  ONBOARDING
  ACTIVE
  INACTIVE
  SUSPENDED
  DELETION_PENDING
}

type Tenant {
  id: ID!
  name: String!
  organizationName: String!
  slug: String
  type: TenantType!
  status: TenantStatus!
  contactEmail: String
  contactPhone: String
  address: String
  academicYearStartMonth: Int
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deactivatedAt: AWSDateTime
  deletionRequestedAt: AWSDateTime
  deletionRequestedBy: ID
  deletionReason: String
  deletedAt: AWSDateTime
  deletedBy: ID
  purgeEligibleAt: AWSDateTime
}

type ProvisionTenantWarning {
  code: String!
  message: String!
}
type ProvisionTenantPayload {
  tenantId: ID!
  organizationName: String!
  slug: String!
  onboardingStatus: String!
  primaryAdminInviteStatus: String!
  warnings: [ProvisionTenantWarning!]!
}
input ProvisionTenantInput {
  organizationName: String!
  slug: String!
  primaryAdminFullName: String!
  primaryAdminEmail: AWSEmail!
  clientRequestId: ID!
}

type TenantEdge {
  cursor: String!
  node: Tenant!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type TenantConnection {
  edges: [TenantEdge!]!
  pageInfo: PageInfo!
}

type CurrentTenantSummary {
  name: String!
  code: String!
  slug: String
  status: TenantStatus!
}

type PlatformDashboardSummary {
  tenantCount: Int!
  activeTenantCount: Int!
  suspendedTenantCount: Int!
  bootstrapCount: Int!
  activeFeatureFlagCount: Int!
  auditLogCount: Int!
  onboardingTenantCount: Int!
  deletionPendingTenantCount: Int!
  failedBootstrapCount: Int!
  pendingBootstrapCount: Int!
}

enum FeatureFlagStatus {
  ACTIVE
  INACTIVE
}
type PlatformFeatureFlag {
  id: ID!
  code: String!
  name: String!
  description: String
  isEnabled: Boolean!
  status: FeatureFlagStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deactivatedAt: AWSDateTime
}

type PlatformAuditLog {
  id: ID!
  actorId: ID
  tenantId: ID
  tenantName: String
  action: String!
  entityType: String!
  entityId: ID
  details: AWSJSON
  createdAt: AWSDateTime!
}

enum BootstrapStatus {
  PENDING
  INVITED
  COMPLETED
  FAILED
}
type FirstAdminBootstrap {
  id: ID!
  tenantId: ID!
  adminName: String!
  adminEmail: AWSEmail!
  adminPhone: String
  roleCode: String!
  status: BootstrapStatus!
  inviteId: ID
  inviteError: String
  inviteAttempts: Int!
  lastInviteAttemptAt: AWSDateTime
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  invitedAt: AWSDateTime
  completedAt: AWSDateTime
}

input CreateFeatureFlagInput {
  code: String!
  name: String!
  description: String
  isEnabled: Boolean
}
input UpdateFeatureFlagInput {
  id: ID!
  name: String
  description: String
  isEnabled: Boolean
  status: FeatureFlagStatus
}
input CreateFirstAdminBootstrapInput {
  tenantId: ID!
  adminName: String!
  adminEmail: AWSEmail!
  adminPhone: String
}

enum TenantEntitlementStatus {
  ENABLED
  DISABLED
}
type TenantCapability {
  code: String!
  name: String!
  description: String!
  owner: String!
  designSections: [Int!]!
  dependencies: [String!]!
}
type TenantEntitlement {
  id: ID!
  tenantId: ID!
  featureCode: String!
  status: TenantEntitlementStatus!
  limits: AWSJSON
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}
input SetTenantEntitlementInput {
  tenantId: ID!
  featureCode: String!
  status: TenantEntitlementStatus!
  limits: AWSJSON
}
enum PlatformIntegrationCode {
  EMAIL
  SMS
  PAYMENTS
  STORAGE
}
enum PlatformIntegrationStatus {
  CONFIGURED
  DISABLED
  DEGRADED
}
type PlatformIntegration {
  id: ID!
  code: PlatformIntegrationCode!
  status: PlatformIntegrationStatus!
  secretReference: String
  settings: AWSJSON!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}
input SetPlatformIntegrationInput {
  code: PlatformIntegrationCode!
  status: PlatformIntegrationStatus!
  secretReference: String
  settings: AWSJSON
}
enum EmailDeliveryEventType {
  SEND
  DELIVERY
  DELIVERY_DELAY
  BOUNCE
  COMPLAINT
  REJECT
  RENDERING_FAILURE
}
type EmailDeliveryEvent {
  id: ID!
  messageId: ID!
  eventType: EmailDeliveryEventType!
  occurredAt: AWSDateTime!
  recipients: [AWSEmail!]!
}

input UpdateTenantInput {
  tenantId: ID!
  name: String
  contactEmail: String
  contactPhone: String
  address: String
  academicYearStartMonth: Int
  clientRequestId: ID!
}

