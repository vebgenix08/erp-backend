enum FinanceRecordStatus {
  ACTIVE
  INACTIVE
}
enum FeeHeadCategory {
  TUITION
  ADMISSION
  EXAM
  LIBRARY
  LAB
  TRANSPORT
  HOSTEL
  OTHER
}
enum FeeSchedulePattern {
  ANNUAL
  ONE_TIME
  PERIODIC
  MANUAL
}
enum FeeCollectionPolicy {
  FULL_ONLY
  PARTIAL_ALLOWED
}

type FeeHead {
  id: ID!
  code: String!
  name: String!
  category: FeeHeadCategory!
  description: String
  refundable: Boolean!
  status: FinanceRecordStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}
type FeeSchedule {
  id: ID!
  campusId: ID!
  academicYearId: ID!
  code: String!
  name: String!
  pattern: FeeSchedulePattern!
  collectionPolicy: FeeCollectionPolicy!
  status: FinanceRecordStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}
type FeeStructureComponent {
  feeHeadId: ID!
  amountMinor: Int!
  allocationPriority: Int!
}
type FeeStructure {
  id: ID!
  campusId: ID!
  academicYearId: ID!
  code: String!
  name: String!
  currency: String!
  components: [FeeStructureComponent!]!
  totalAmountMinor: Int!
  status: FinanceRecordStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}
type FeeMappingTarget {
  programId: ID
  classId: ID!
  sectionId: ID
}
type FeeMapping {
  id: ID!
  campusId: ID!
  academicYearId: ID!
  structureId: ID!
  scheduleId: ID!
  target: FeeMappingTarget!
  status: FinanceRecordStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}
type FeeConfiguration {
  feeHeads: [FeeHead!]!
