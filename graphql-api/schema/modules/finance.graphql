}

enum FeeOrderStatus {
  OPEN
  PARTIALLY_PAID
  PAID
  CLOSED
  CANCELLED
}
enum FeeOrderSourceType {
  ANNUAL
  GENERAL
  TRANSFER_ADJUSTMENT
}
type FeeOrderCharge {
  id: ID!
  feeHeadId: ID!
  feeHeadCode: String!
  label: String!
  refundable: Boolean!
  sequence: Int!
  amountMinor: Int!
  paidMinor: Int!
  balanceMinor: Int!
  creditMinor: Int
}
type FeeOrder {
  id: ID!
  orderNumber: String!
  sourceType: FeeOrderSourceType!
  sourceId: ID!
  note: String
  studentId: ID!
  studentName: String!
  registrationNumber: String!
  enrollmentId: ID!
  campusId: ID!
  academicYearId: ID!
  programId: ID!
  classId: ID!
  sectionId: ID
  mappingId: ID!
  structureId: ID!
  structureCode: String!
  structureName: String!
  scheduleId: ID!
