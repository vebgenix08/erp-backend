schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

scalar AWSDateTime

type Subscription {
  onTenantUpdated(id: ID!): Tenant
    @aws_subscribe(mutations: ["updateTenant", "deactivateTenant", "activateTenant", "suspendTenant", "requestTenantDeletion", "confirmTenantDeletion"])
}

type ApiHealth {
  ok: Boolean!
  environment: String!
}
